name: Build and Push LIO Images (ARM64)

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      fast_lio_repository:
        description: FAST-LIO Git repository to build
        required: false
        default: https://github.com/hku-mars/FAST_LIO.git
        type: string
      fast_lio_ref:
        description: FAST-LIO ref to build (prefer a full commit SHA)
        required: false
        default: a4743b095409588842a5b30ddfa27e29d2f99164
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - implementation: fast-lio
            dockerfile: images/fast-lio/Dockerfile
            image: ghcr.io/skymule-ai/mullet-lio-fast-lio

    steps:
      # The CUDA base image is ~13.5 GB; with the runner's stock toolchains there is not enough
      # disk for it, the Livox image, the FAST-LIO build and the smoke-test image load.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Always: the Livox image the build copies its messages from is in GHCR.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # .env.example is the single place the base and Livox images are pinned.
      - name: Read pinned images
        id: pins
        run: |
          echo "base_image=$(sed -n 's/^BASE_IMAGE=//p' .env.example)" >> "$GITHUB_OUTPUT"
          echo "livox_image=$(sed -n 's/^LIVOX_IMAGE=//p' .env.example)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          load: true
          build-args: |
            BASE_IMAGE=${{ steps.pins.outputs.base_image }}
            LIVOX_IMAGE=${{ steps.pins.outputs.livox_image }}
            FAST_LIO_REPOSITORY=${{ inputs.fast_lio_repository || vars.FAST_LIO_REPOSITORY || 'https://github.com/hku-mars/FAST_LIO.git' }}
            FAST_LIO_REF=${{ inputs.fast_lio_ref || vars.FAST_LIO_REF || 'a4743b095409588842a5b30ddfa27e29d2f99164' }}
          tags: mullet-fast-lio-smoke:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.implementation }}
          cache-to: type=gha,mode=max,scope=${{ matrix.implementation }}

      - name: Smoke test image
        env:
          FAST_LIO_IMAGE: mullet-fast-lio-smoke:${{ github.sha }}
        run: ./scripts/smoke-fast-lio.sh

      - name: Publish tested image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.pins.outputs.base_image }}
            LIVOX_IMAGE=${{ steps.pins.outputs.livox_image }}
            FAST_LIO_REPOSITORY=${{ inputs.fast_lio_repository || vars.FAST_LIO_REPOSITORY || 'https://github.com/hku-mars/FAST_LIO.git' }}
            FAST_LIO_REF=${{ inputs.fast_lio_ref || vars.FAST_LIO_REF || 'a4743b095409588842a5b30ddfa27e29d2f99164' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.implementation }}
