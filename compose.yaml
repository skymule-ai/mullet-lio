name: mullet-lio

x-ros-environment: &ros-environment
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
  # Same as mullet-core and the paddock: Fast DDS shared memory across host-networked
  # containers discovers topics but drops samples.
  FASTDDS_BUILTIN_TRANSPORTS: ${FASTDDS_BUILTIN_TRANSPORTS:-UDPv4}
  NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
  NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}

services:
  # /livox/lidar (CustomMsg), /livox/imu
  livox:
    profiles: [livox, fast-lio]
    image: ${LIVOX_IMAGE:-ghcr.io/skymule-ai/mullet-drivers-livox:sha-29ab1e8}
    network_mode: host
    ipc: host
    runtime: nvidia
    environment: *ros-environment
    volumes:
      - ./config/livox:/config:ro

  # PTP master on the LiDAR's interface: synced, stamps are measurement times, not arrival times.
  livox-ptp:
    profiles: [livox, fast-lio]
    image: ${LIVOX_IMAGE:-ghcr.io/skymule-ai/mullet-drivers-livox:sha-29ab1e8}
    network_mode: host
    command: [ptp4l, -i, "${LIVOX_IFACE:?set LIVOX_IFACE in .env}", -S, -m, --serverOnly, "1"]

  fast-lio:  # /uav0/fast_lio/odometry
    profiles: [fast-lio]
    build:
      context: .
      dockerfile: images/fast-lio/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ghcr.io/skymule-ai/mullet-base:v0.5.1}
        LIVOX_IMAGE: ${LIVOX_IMAGE:-ghcr.io/skymule-ai/mullet-drivers-livox:sha-29ab1e8}
        FAST_LIO_REPOSITORY: ${FAST_LIO_REPOSITORY:-https://github.com/hku-mars/FAST_LIO.git}
        FAST_LIO_REF: ${FAST_LIO_REF:-a4743b095409588842a5b30ddfa27e29d2f99164}
    image: ${FAST_LIO_IMAGE:-ghcr.io/skymule-ai/mullet-lio-fast-lio:main}
    network_mode: host
    ipc: host
    runtime: nvidia
    depends_on:
      livox:
        condition: service_started
    environment: *ros-environment
    volumes:
      - ./config/fast-lio:/config:ro
